[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitagent"
version = "0.1.0"
description = "Git-backed memory management for agent sessions."
requires-python = ">=3.10"

[project.scripts]
gitagent = "gitagent.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["gitagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
