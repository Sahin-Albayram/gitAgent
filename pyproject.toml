[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitagent"
version = "0.1.0"
description = "Git-backed memory management for agent sessions."
requires-python = ">=3.10"

[project.scripts]
gitagent = "gitagent.cli:main"

[project.optional-dependencies]
dev = ["pytest"]
# Kept optional on purpose: chromadb is a heavy install (onnxruntime, numpy,
# and friends) and the day-to-day open/update/close path never touches it.
search = ["chromadb>=1.0"]

[tool.setuptools.packages.find]
include = ["gitagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
